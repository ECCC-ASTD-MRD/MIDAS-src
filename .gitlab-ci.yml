variables:
    # CI_DEBUG_TRACE: "true"
    MIDAS_ABS: /home/sanl888/data_maestro/ords/midas/gitlab-ci/abs
    MIDAS_ABS_ARCHIVE: /home/sanl888/data_maestro/midas/midas/gitlab-ci/abs
    SSM_PACKAGES: /home/sanl888/data_maestro/ords/midas/gitlab-ci/packages
    LISTINGS_ARCHIVE: /home/sanl888/data_maestro/midas/UnitTests/midas/listings
    SEQ_MAESTRO_SHORTCUT: ". ssmuse-sh -d eccc/cmo/isst/maestro/20250808"
    ORD_SOUMET_ARGS: "-jn midas_ci -cpus 1 -m 10G -w 360"

stages:
   - build
   - test
   - clean
   - doc
   - deploy

midas_build:
  stage: build
  parallel:
    matrix:
      - RUNNER_TAG: hpcr-u3
  script:
    - version=$(./midas.version)
    - cd src
    - MIDAS_COMPILE_DIR_MAIN=${MIDAS_ABS}/${version} MIDAS_ABS_LEAFDIR=./ ./midas_build
  only:
    - main
    - v_4.1
    - tags
  tags:
    - ${RUNNER_TAG}

monitor_tests:
   stage: test
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - version=$(./midas.version)
     - cd tools/monitor
     - ./test.sh ${MIDAS_ABS}/${version}/midas.monitor-$(../../midas.version).Abs
   only:
     - main
     - v_4.1
     - tags
   tags:
     - ${RUNNER_TAG}

splitobs_burp_tests:
   stage: test
   variables:
       ORD_SOUMET_ARGS: "-jn burp_splitobs_ci -cpus 1 -m 32G -w 240"
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - version=$(./midas.version)
     - cd tools/splitobs
     - export SPLITOBS=${MIDAS_ABS}/${version}/midas.splitobs_${ORDENV_PLAT}-${version}.Abs
     - export WORKDIR=${HOME}/data_maestro/${ORDENV_TRUEHOST}/splitobs/work_burp_${CI_BUILD_ID}
     - ./unittest burp
     - rm -rf ${WORKDIR}
   only:
     - tags
   tags:
     - ${RUNNER_TAG}

splitobs_rdb_tests:
   stage: test
   variables:
       ORD_SOUMET_ARGS: "-jn rdb_splitobs_ci -cpus 1 -m 32G -w 240"
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - version=$(./midas.version)
     - cd tools/splitobs
     - export SPLITOBS=${MIDAS_ABS}/${version}/midas.splitobs_${ORDENV_PLAT}-${version}.Abs
     - export WORKDIR=${HOME}/data_maestro/${ORDENV_TRUEHOST}/splitobs/work_rdb_${CI_BUILD_ID}
     - ./unittest rdb
     - rm -rf ${WORKDIR}
   only:
     - tags
   tags:
     - ${RUNNER_TAG}

midas_tests:
   stage: test
   variables:
       ## 2880 minutes is 48 hours
       ORD_SOUMET_ARGS: "-jn midas_tests_ci -cpus 1 -w 2880 -q dev_daemon"
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - version=$(./midas.version)
     - . ssmuse-sh -d eccc/cmd/cmdi/utils/2.12
     - cd maestro/suites/midas_system_tests
     - suite=midas-$(echo ${CI_COMMIT_SHA} | cut -c-10)
     - ./install_suite.sh $suite run ${MIDAS_ABS}/${version}
     - ./wait4tests.sh $suite
     - ./extractRunTime.sh -findOutliers -emails ervig.lapalme@ec.gc.ca mark.buehner@ec.gc.ca
     - collect_unittest_listings_workdir=${PWD}/tmpdir collect_unittest_listings_output=$LISTINGS_ARCHIVE ./collect_unittest_listings
     - . ./set_machine_list.dot
     - clean_suite --yes ${suite}
     - rm ~/.suites/${suite}
     - rmdir ~/data_maestro/ords/maestro/${suite}
   only:
     - main
     - v_4.1
     - tags
   tags:
     - ${RUNNER_TAG}

findTrials_tests:
   stage: test
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - cd tools/findTrials
     - ./midas.findTrials --unittest
   only:
     - main
     - v_4.1
     - tags
   tags:
     - ${RUNNER_TAG}

topoFinder_tests:
   stage: test
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - cd tools/midas_scripts
     - ./midas.mpiTopoFinder --unittest
   only:
     - main
     - v_4.1
     - tags
   tags:
     - ${RUNNER_TAG}

isFileInList_tests:
   stage: test
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - cd tools/midas_scripts
     - ./midas.isFileInList --unittest
   only:
     - main
     - v_4.1
     - tags
   tags:
     - ${RUNNER_TAG}

timingTool_tests:
    stage: test
    parallel:
      matrix:
        - RUNNER_TAG: hpcr-u3
    script:
      - cd tools/timingTool
      - ./midas.timingTool --unittest
    only:
      - main
      - v_4.1
      - tags
    tags:
      - ${RUNNER_TAG}

clean_midas_abs:
   stage: clean
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - version=$(./midas.version)
     - echo Moving programs for version ${version} in ${MIDAS_ABS}/${version} to ${MIDAS_ABS_ARCHIVE}/${version}
     - mv $MIDAS_ABS/${version} ${MIDAS_ABS_ARCHIVE}/${version}
   only:
     - main
     - v_4.1
     - tags
   tags:
     - ${RUNNER_TAG}

doc_sphinx:
   stage: doc
   variables:
     docname: ${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
     midasdoc: /home/sanl888/public_html/midas-sphinx-doc
   parallel:
     matrix:
       - RUNNER_TAG: hpcr-u3
   script:
     - cd scripts/sphinx
     - ./build_html.sh ../../src ${midasdoc}/${docname}
     - rm -fv ${midasdoc}/latest-${CI_COMMIT_REF_NAME}
     - ln -sv ${midasdoc}/${docname} ${midasdoc}/latest-${CI_COMMIT_REF_NAME}
   only:
     - main
     - v_4.1
     - tags
   tags:
     - ${RUNNER_TAG}

ssm:
  stage: deploy
  parallel:
    matrix:
      - RUNNER_TAG: hpcr-u3
  script:
    - version=$(./midas.version) ## This version number contains the 'v_'
    - ./set_resources_def.sh
    - . maestro/suites/midas_system_tests/set_machine_list.dot
    ## remove the 'v_' from the tag name since MIDAS domains do not contain 'v_' but starts with the number
    - VERSION=$(./midas.version | cut -c3-)
    - cd ssm
    - ./build_packages --midas-abs ${MIDAS_ABS_ARCHIVE}/${version} --packages ${SSM_PACKAGES}/${VERSION}
    ## For this command to work, we must put in '/home/sanl000/.ssh/authorized_keys' this:
    ##     no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-pty,command="/home/sanl000/bin/ssh_command ${SSH_ORIGINAL_COMMAND}" ssh-rsa .... sanl888@hpci-util
    - ssh sanl000@${MACHINE_PPP} /home/sanl000/ssm/ssm_publish midas ${VERSION} ${SSM_PACKAGES}/${VERSION}
    - rm -rf ${SSM_PACKAGES}/${VERSION}
  only:
    - tags
  tags:
    - ${RUNNER_TAG}
